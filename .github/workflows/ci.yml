name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter version
        run: python --version

      - name: Compile prototype
        run: python -m compileall -q prototype

      - name: Run prototype unit tests
        run: python -m unittest discover -s prototype/tests -v

  production:
    name: Production backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: bardi_ci
      POSTGRES_USER: bardi_ci
      POSTGRES_PASSWORD: bardi-ci-postgres-password-only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-strong-django-secret-key-9f5e3d2c1b7a6e4d8c0f
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://ci.example.test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bardi_ci
          POSTGRES_USER: bardi_ci
          POSTGRES_PASSWORD: bardi-ci-postgres-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bardi_ci -d bardi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint production backend
        run: uv run ruff check backend

      - name: Check production formatting
        run: uv run ruff format --check backend

      - name: Type-check production backend
        run: uv run mypy backend

      - name: Compile project Python
        run: uv run python -m compileall -q backend prototype

      - name: Run Django deploy checks
        run: uv run python backend/manage.py check --deploy --settings=bardi.settings.production

      - name: Check migrations are current
        run: uv run python backend/manage.py makemigrations --check --dry-run --settings=bardi.settings.test

      - name: Apply migrations
        run: uv run python backend/manage.py migrate --noinput --settings=bardi.settings.test

      - name: Verify migration state
        run: uv run python backend/manage.py migrate --check --settings=bardi.settings.test

      - name: Run cross-family production acceptance suite
        run: >-
          cd backend && uv run python manage.py test
          api.tests.test_cross_family_production_parity
          --settings=bardi.settings.test

      - name: Run all other production backend tests
        run: >-
          cd backend && uv run python manage.py test
          --exclude-tag=production_acceptance
          --settings=bardi.settings.test

  required:
    name: CI required
    needs:
      - test
      - production
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify prototype and production tracks passed
        env:
          PROTOTYPE_RESULT: ${{ needs.test.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          test "$PROTOTYPE_RESULT" = "success"
          test "$PRODUCTION_RESULT" = "success"
