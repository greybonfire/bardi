name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: bardi_ci
      POSTGRES_USER: bardi_ci
      POSTGRES_PASSWORD: bardi-ci-postgres-password-only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-strong-django-secret-key-9f5e3d2c1b7a6e4d8c0f
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://ci.example.test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bardi_ci
          POSTGRES_USER: bardi_ci
          POSTGRES_PASSWORD: bardi-ci-postgres-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bardi_ci -d bardi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint production backend
        run: uv run ruff check backend

      - name: Check production formatting
        run: uv run ruff format --check backend

      - name: Type-check production backend
        run: uv run mypy backend

      - name: Compile project Python
        run: uv run python -m compileall -q backend

      - name: Run Django deploy checks
        run: uv run python backend/manage.py check --deploy --settings=bardi.settings.production

      - name: Check migrations are current
        run: uv run python backend/manage.py makemigrations --check --dry-run --settings=bardi.settings.test

      - name: Apply migrations
        run: uv run python backend/manage.py migrate --noinput --settings=bardi.settings.test

      - name: Verify migration state
        run: uv run python backend/manage.py migrate --check --settings=bardi.settings.test

      - name: Exercise latest project migration rollback and reapply
        run: |
          uv run python backend/manage.py migrate knowledge 0017 --noinput --settings=bardi.settings.test
          uv run python backend/manage.py migrate knowledge 0018 --noinput --settings=bardi.settings.test
          uv run python backend/manage.py migrate --check --settings=bardi.settings.test

      - name: Exercise PostgreSQL backup and restore
        run: |
          mkdir -p .ci-recovery
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            postgres:17 \
            pg_dump \
              --host=127.0.0.1 \
              --port="$POSTGRES_PORT" \
              --username="$POSTGRES_USER" \
              --dbname="$POSTGRES_DB" \
              --format=custom \
              --no-owner \
              > .ci-recovery/bardi.dump

          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            postgres:17 \
            dropdb \
              --if-exists \
              --host=127.0.0.1 \
              --port="$POSTGRES_PORT" \
              --username="$POSTGRES_USER" \
              bardi_ci_restore

          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            postgres:17 \
            createdb \
              --host=127.0.0.1 \
              --port="$POSTGRES_PORT" \
              --username="$POSTGRES_USER" \
              bardi_ci_restore

          docker run --rm --network host -i \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            postgres:17 \
            pg_restore \
              --host=127.0.0.1 \
              --port="$POSTGRES_PORT" \
              --username="$POSTGRES_USER" \
              --dbname=bardi_ci_restore \
              --no-owner \
              --no-privileges \
              < .ci-recovery/bardi.dump

          POSTGRES_DB=bardi_ci_restore \
            uv run python backend/manage.py migrate --check --settings=bardi.settings.test

          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            postgres:17 \
            psql \
              --host=127.0.0.1 \
              --port="$POSTGRES_PORT" \
              --username="$POSTGRES_USER" \
              --dbname=bardi_ci_restore \
              --tuples-only \
              --no-align \
              --command="SELECT COUNT(*) FROM django_migrations;" \
            | grep -Eq '^[1-9][0-9]*$'

          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            postgres:17 \
            dropdb \
              --host=127.0.0.1 \
              --port="$POSTGRES_PORT" \
              --username="$POSTGRES_USER" \
              bardi_ci_restore
          rm -rf .ci-recovery

      - name: Run cross-family production acceptance suite
        run: >-
          cd backend && uv run python manage.py test
          api.tests.test_cross_family_production_parity
          --settings=bardi.settings.test

      - name: Run domain, publication, API/privacy, Admin, and hardening suites
        run: >-
          cd backend && uv run python manage.py test
          planning.tests knowledge.tests api.tests core.tests
          --exclude-tag=production_acceptance
          --settings=bardi.settings.test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BARDI_API_ORIGIN: http://127.0.0.1:8451
      BARDI_SITE_ORIGIN: http://localhost:3010

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.14 for the database-free API exporter
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install locked API exporter dependencies
        run: uv sync --locked

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Check public OpenAPI snapshot without PostgreSQL
        run: uv run python tools/export_web_api.py --check

      - name: Check generated API types
        run: |
          npm --prefix frontend run api:generate
          git diff --exit-code -- frontend/api-schema.json frontend/src/api/generated.d.ts

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Type-check frontend
        run: npm --prefix frontend run typecheck

      - name: Run frontend unit and component tests
        run: npm --prefix frontend run test

      - name: Build production frontend
        run: npm --prefix frontend run build

      - name: Install managed Chromium and system dependencies
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run production-build browser tests with the test-only API
        run: npm --prefix frontend run test:e2e

  compose:
    name: Development Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare development environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start full development stack
        run: docker compose up --build -d

      - name: Verify backend and frontend endpoints
        shell: bash
        run: |
          set -euo pipefail

          wait_for() {
            local url="$1"
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error --output /dev/null "$url"; then
                return 0
              fi
              sleep 2
            done
            docker compose ps
            docker compose logs --no-color
            return 1
          }

          wait_for http://127.0.0.1:8000/v1/services
          wait_for http://127.0.0.1:3000/ar

      - name: Stop development stack
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans

  required:
    name: CI required
    needs:
      - production
      - frontend
      - compose
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify all tracks passed
        env:
          PRODUCTION_RESULT: ${{ needs.production.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
        run: |
          test "$PRODUCTION_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$COMPOSE_RESULT" = "success"
