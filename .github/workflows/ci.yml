name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rename_service_terminology:
    name: Apply production Service terminology
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/34-core-planning-catalog' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/34-core-planning-catalog

      - name: Rename production Goal terminology to Service
        run: |
          python - <<'PY'
          from pathlib import Path

          # Production Python only. The frozen prototype is intentionally untouched.
          for path in Path("backend").rglob("*.py"):
              text = path.read_text()
              updated = text.replace("Goal", "Service").replace("goal", "service")
              if updated != text:
                  path.write_text(updated)

          # Current production design/glossary only. Historical ADRs and prototype
          # evidence remain unchanged; ADR 0014 records the terminology transition.
          production_docs = [Path("CONTEXT.md"), *Path("docs/architecture").glob("*.md")]
          for path in production_docs:
              text = path.read_text()
              updated = (
                  text.replace("Goals", "Services")
                  .replace("Goal", "Service")
                  .replace("goals", "services")
                  .replace("goal", "service")
                  # Preserve historical ADR filenames if a production doc links them.
                  .replace(
                      "0008-use-services-to-group-related-procedures.md",
                      "0008-use-goals-to-group-related-procedures.md",
                  )
                  .replace(
                      "0013-own-planning-questions-at-service-level.md",
                      "0013-own-planning-questions-at-goal-level.md",
                  )
              )
              if updated != text:
                  path.write_text(updated)

          adr_index = Path("docs/adr/README.md")
          index_text = adr_index.read_text()
          index_text = index_text.replace(
              "| [0008](0008-use-goals-to-group-related-procedures.md) | Use stable Goals to group related concrete Procedures. |",
              "| [0008](0008-use-goals-to-group-related-procedures.md) | Historical `Goal` terminology for the stable Procedure grouping; production naming is superseded by ADR 0014. |",
          )
          index_text = index_text.replace(
              "| [0013](0013-own-planning-questions-at-goal-level.md) | Author planning Questions at Goal level so they are available before Procedure selection. |",
              "| [0013](0013-own-planning-questions-at-goal-level.md) | Author planning Questions on the stable Procedure grouping so they are available before Procedure selection; current production name: Service. |",
          )
          row = "| [0014](0014-use-service-as-production-procedure-grouping.md) | Use Service / خدمة as the production name for the stable Procedure grouping; keep Goal only in the frozen prototype and historical records. |\n"
          marker = "\n## Adding or superseding an ADR\n"
          if row not in index_text:
              index_text = index_text.replace(marker, row + marker)
          adr_index.write_text(index_text)

          Path("docs/adr/0014-use-service-as-production-procedure-grouping.md").write_text(
              """# ADR 0014: Use Service as the production Procedure grouping\n\n"
              "**Status:** Accepted  \n"
              "**Date:** 2026-09-02\n\n"
              "## Context\n\n"
              "The frozen prototype calls the stable bilingual user-entry grouping of related Procedures a `Goal`. Production persistence and application design are now being implemented, and the entity's actual responsibility is a government-service catalog grouping rather than an abstract user objective. `Service` / `خدمة` is clearer and more natural in both English and Arabic, and it leaves `Goal` available for a future cross-service user-intent concept if one is ever needed.\n\n"
              "The prototype is frozen and remains an executable reference. Renaming its code, fixtures, evidence packs, or historical terminology would create churn without changing the production contract.\n\n"
              "## Decision\n\n"
              "Production uses `Service` as the stable bilingual grouping and user-entry point for closely related Procedures. A Service owns its curated Procedure candidate set, Service Questions, and Service-owned contradiction/case-invariant definitions. Each Procedure has one primary Service in version 1. Service-specific selection remains independent from Procedure-Version applicability.\n\n"
              "This is a terminology change, not a semantic change. A Service is not itself a concrete government transaction and does not own Procedure-specific requirements, fees, steps, routing, evidence, or Eligibility Bases. `Service Point` remains the distinct concept for a physical office or digital destination.\n\n"
              "Production code, schema, API contracts, current architecture documents, and active production issues use `Service`. The frozen prototype and prototype evidence retain `Goal`. When comparing production behavior with the prototype, prototype `Goal` maps directly to production `Service`.\n\n"
              "This ADR supersedes the production terminology of ADR 0008 and ADR 0013 while preserving their substantive decisions about grouping related Procedures and owning pre-selection Questions.\n\n"
              "## Consequences\n\n"
              "- Production model names use `Service`, `ServiceProcedureCandidate`, `ServiceQuestion`, and `ServiceContradiction`, with `primary_service` and `service_id` relationships.\n"
              "- Public navigation can use Service / خدمة without translating an internal `Goal` concept for users.\n"
              "- The word `Goal` is no longer consumed by the production catalog model and may later describe a genuine user intent spanning multiple Services if research proves that layer necessary.\n"
              "- Historical ADRs and the frozen prototype may still contain `Goal`; those references are historical/reference terminology rather than the current production model.\n"
              "- No planner truth semantics, candidate-selection behavior, publication rule, or evidence requirement changes as a result of this rename.\n"
              """
          )
          PY

      - name: Commit terminology migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend CONTEXT.md docs/architecture docs/adr/README.md docs/adr/0014-use-service-as-production-procedure-grouping.md
          if git diff --cached --quiet; then
            echo "Terminology already migrated."
          else
            if git diff --cached --name-only | grep -E '^(prototype/|docs/evidence-packs/|docs/prototype-capability-report\.md$)'; then
              echo "Frozen prototype/reference files must not be changed." >&2
              exit 1
            fi
            git commit -m "Rename production Goal domain to Service"
            git push origin HEAD:feat/34-core-planning-catalog
          fi

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter version
        run: python --version

      - name: Compile prototype
        run: python -m compileall -q prototype

      - name: Run prototype unit tests
        run: python -m unittest discover -s prototype/tests -v

  production:
    name: Production backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: bardi_ci
      POSTGRES_USER: bardi_ci
      POSTGRES_PASSWORD: bardi-ci-postgres-password-only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-strong-django-secret-key-9f5e3d2c1b7a6e4d8c0f
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://ci.example.test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bardi_ci
          POSTGRES_USER: bardi_ci
          POSTGRES_PASSWORD: bardi-ci-postgres-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bardi_ci -d bardi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint production backend
        run: uv run ruff check backend

      - name: Check production formatting
        run: uv run ruff format --check backend

      - name: Type-check production backend
        run: uv run mypy backend

      - name: Compile project Python
        run: uv run python -m compileall -q backend prototype

      - name: Run Django deploy checks
        run: uv run python backend/manage.py check --deploy --settings=bardi.settings.production

      - name: Check migrations are current
        run: uv run python backend/manage.py makemigrations --check --dry-run --settings=bardi.settings.test

      - name: Apply migrations
        run: uv run python backend/manage.py migrate --noinput --settings=bardi.settings.test

      - name: Verify migration state
        run: uv run python backend/manage.py migrate --check --settings=bardi.settings.test

      - name: Run all production backend tests
        run: cd backend && uv run python manage.py test --settings=bardi.settings.test

  required:
    name: CI required
    needs:
      - test
      - production
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify prototype and production tracks passed
        env:
          PROTOTYPE_RESULT: ${{ needs.test.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          test "$PROTOTYPE_RESULT" = "success"
          test "$PRODUCTION_RESULT" = "success"
