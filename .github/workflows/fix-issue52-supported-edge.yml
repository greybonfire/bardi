name: Fix issue 52 supported edge

on:
  push:
    branches:
      - feat/52-import-temporary-family-exemption

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/52-import-temporary-family-exemption
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked --extra dev
      - name: Correct historical temporal scenario kind
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/knowledge/importers/temporary_family_exemption.py")
          text = path.read_text()
          old = '''                "mil.temporal.terrorist_not_active_march_24",\n                "negative",\n'''
          new = '''                "mil.temporal.terrorist_not_active_march_24",\n                "supported_edge",\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one historical temporal scenario, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          uv run ruff format backend/knowledge/importers/temporary_family_exemption.py
          uv run ruff check backend/knowledge/importers/temporary_family_exemption.py
          uv run mypy backend/knowledge/importers/temporary_family_exemption.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/knowledge/importers/temporary_family_exemption.py
          git commit -m "Classify historical amendment boundary as supported edge"
          git push origin HEAD:feat/52-import-temporary-family-exemption
