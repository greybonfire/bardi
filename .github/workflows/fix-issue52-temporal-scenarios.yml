name: Fix issue 52 temporal scenarios

on:
  push:
    branches:
      - feat/52-import-temporary-family-exemption

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/52-import-temporary-family-exemption
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked --extra dev
      - name: Make scenario expectations temporal-aware
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/knowledge/importers/temporary_family_exemption.py")
          text = path.read_text()

          old = '''    def basis_plan(basis_id: str, route_id: str | None = None) -> dict[str, object]:\n        return {\n            "procedure_version_id": version_id,\n            "eligibility_basis_ids": [basis_id],\n            "inconclusive_basis_ids": [basis_id],\n            **(\n                {"routing_status": "resolved", "routing_association_ids": [route_id]}\n                if route_id\n                else {}\n            ),\n        }\n'''
          new = '''    def basis_plan(basis_id: str, route_id: str | None = None) -> dict[str, object]:\n        identifiers: dict[str, object] = {\n            "procedure_version_id": version_id,\n            "eligibility_basis_ids": [basis_id],\n            "inconclusive_basis_ids": [basis_id],\n        }\n        if amended and route_id:\n            identifiers.update(\n                {\n                    "routing_status": "resolved",\n                    "routing_association_ids": [route_id],\n                }\n            )\n        elif not amended:\n            identifiers.update(\n                {\n                    "routing_status": "unresolved",\n                    "routing_association_ids": [],\n                    "inconclusive_sections": ["checklist_items", "steps"],\n                }\n            )\n        return identifiers\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected basis_plan once, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        (\n            "mil.unknown.reachability_first",\n            "unknown",\n            {"application_location": "inside_egypt"},\n            "next_question",\n            {"question_id": "q.mil.father_alive"},\n            [],\n        ),\n        (\n            "mil.unknown.only_son_qualification",\n            "unknown",\n            {"application_location": "inside_egypt", "father_alive": True},\n            "next_question",\n            {"question_id": "q.mil.other_sons_count"},\n            [],\n        ),\n        (\n            "mil.unreachable.father_qualification_suppressed",\n            "unknown",\n            {"application_location": "inside_egypt", "father_alive": False},\n            "next_question",\n            {"question_id": "q.mil.mother_status"},\n            [],\n        ),\n'''
          new = '''        (\n            "mil.unknown.reachability_first",\n            "unknown",\n            {"application_location": "inside_egypt"},\n            "next_question" if amended else "plan",\n            (\n                {"question_id": "q.mil.father_alive"}\n                if amended\n                else {\n                    "procedure_version_id": version_id,\n                    "eligibility_basis_ids": [],\n                    "inconclusive_basis_ids": [\n                        "family.missing_war_or_terror_relative",\n                        "family.only_son_living_father",\n                        "family.sibling_current_service",\n                        "family.support_father_or_incapable_brothers",\n                        "family.support_mother",\n                        "family.support_unmarried_sisters",\n                    ],\n                    "routing_status": "unresolved",\n                    "inconclusive_sections": ["checklist_items", "steps"],\n                }\n            ),\n            [],\n        ),\n        (\n            "mil.unknown.only_son_qualification",\n            "unknown",\n            {"application_location": "inside_egypt", "father_alive": True},\n            "next_question" if amended else "plan",\n            (\n                {"question_id": "q.mil.other_sons_count"}\n                if amended\n                else {\n                    "procedure_version_id": version_id,\n                    "eligibility_basis_ids": [],\n                    "inconclusive_basis_ids": [\n                        "family.missing_war_or_terror_relative",\n                        "family.only_son_living_father",\n                        "family.sibling_current_service",\n                        "family.support_father_or_incapable_brothers",\n                        "family.support_mother",\n                        "family.support_unmarried_sisters",\n                    ],\n                    "routing_status": "unresolved",\n                    "inconclusive_sections": ["checklist_items", "steps"],\n                }\n            ),\n            [],\n        ),\n        (\n            "mil.unreachable.father_qualification_suppressed",\n            "unknown",\n            {"application_location": "inside_egypt", "father_alive": False},\n            "next_question" if amended else "plan",\n            (\n                {"question_id": "q.mil.mother_status"}\n                if amended\n                else {\n                    "procedure_version_id": version_id,\n                    "eligibility_basis_ids": [],\n                    "inconclusive_basis_ids": [\n                        "family.missing_war_or_terror_relative",\n                        "family.sibling_current_service",\n                        "family.support_mother",\n                        "family.support_unmarried_sisters",\n                    ],\n                    "routing_status": "unresolved",\n                    "inconclusive_sections": ["checklist_items", "steps"],\n                }\n            ),\n            [],\n        ),\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected unknown scenario block once, found {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          uv run ruff format backend/knowledge/importers/temporary_family_exemption.py
          uv run ruff check backend/knowledge/importers/temporary_family_exemption.py
          uv run mypy backend/knowledge/importers/temporary_family_exemption.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/knowledge/importers/temporary_family_exemption.py
          git commit -m "Make temporary exemption scenarios temporal-aware"
          git push origin HEAD:feat/52-import-temporary-family-exemption
