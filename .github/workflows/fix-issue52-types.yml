name: Fix issue 52 typing

on:
  push:
    branches:
      - feat/52-import-temporary-family-exemption

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/52-import-temporary-family-exemption
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked --extra dev
      - name: Apply typing-only fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          importer = Path("backend/knowledge/importers/temporary_family_exemption.py")
          text = importer.read_text()
          text = text.replace("        author=author,\n        legal_risk=True,", "        author=cast(Any, author),\n        legal_risk=True,", 1)
          text = text.replace(
              "    def basis_plan(basis_id, route_id=None):\n",
              "    def basis_plan(\n        basis_id: str, route_id: str | None = None\n    ) -> dict[str, object]:\n",
              1,
          )
          importer.write_text(text)

          tests = Path("backend/knowledge/tests/test_temporary_family_exemption_import.py")
          text = tests.read_text()
          text = text.replace("from io import StringIO\n", "from io import StringIO\nfrom typing import Any, cast\n", 1)
          text = text.replace(
              'self.assertNotIn("terrorist_operations", str(historical_missing.qualification))',
              'self.assertNotIn("terrorist_operations", str(cast(Any, historical_missing).qualification))',
              1,
          )
          text = text.replace(
              'self.assertIn("terrorist_operations", str(current_missing.qualification))',
              'self.assertIn("terrorist_operations", str(cast(Any, current_missing).qualification))',
              1,
          )
          text = text.replace("            father_basis.reachability,", "            cast(Any, father_basis).reachability,", 1)
          text = text.replace("            father_basis.qualification,", "            cast(Any, father_basis).qualification,", 1)
          tests.write_text(text)
          PY
          uv run ruff format backend/knowledge/importers/temporary_family_exemption.py backend/knowledge/tests/test_temporary_family_exemption_import.py
          uv run ruff check backend/knowledge/importers/temporary_family_exemption.py backend/knowledge/tests/test_temporary_family_exemption_import.py
          uv run mypy backend/knowledge/importers/temporary_family_exemption.py backend/knowledge/tests/test_temporary_family_exemption_import.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/knowledge/importers/temporary_family_exemption.py backend/knowledge/tests/test_temporary_family_exemption_import.py
          git commit -m "Fix temporary exemption typing"
          git push origin HEAD:feat/52-import-temporary-family-exemption
