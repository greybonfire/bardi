name: Fix issue 53 acceptance style

on:
  push:
    branches:
      - feat/53-cross-family-production-parity

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/53-cross-family-production-parity
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked --extra dev
      - name: Fix acceptance style
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/api/tests/test_cross_family_production_parity.py')
          text = path.read_text()
          text = text.replace(
              'def test_active_services_and_all_public_result_families_are_cross_family_bilingual(self) -> None:',
              'def test_public_result_families_are_cross_family_bilingual(self) -> None:',
          )
          path.write_text(text)
          PY
          uv run ruff check --fix backend/api/tests/test_cross_family_production_parity.py
          uv run ruff format backend/api/tests/test_cross_family_production_parity.py
          uv run ruff check backend/api/tests/test_cross_family_production_parity.py
          uv run mypy backend/api/tests/test_cross_family_production_parity.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/api/tests/test_cross_family_production_parity.py
          git commit -m "Fix cross-family acceptance style"
          git push origin HEAD:feat/53-cross-family-production-parity
