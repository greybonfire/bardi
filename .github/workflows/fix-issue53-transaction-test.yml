name: Fix issue 53 request transaction harness

on:
  push:
    branches:
      - feat/53-cross-family-production-parity

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/53-cross-family-production-parity
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked --extra dev
      - name: Use real request transaction harness
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/api/tests/test_cross_family_production_parity.py')
          text = path.read_text()
          text = text.replace(
              'from django.test import TestCase, override_settings, tag',
              'from django.test import TransactionTestCase, override_settings, tag',
          )
          text = text.replace(
              'class CrossFamilyProductionParityAcceptanceTests(TestCase):\n    @classmethod\n    def setUpTestData(cls) -> None:',
              'class CrossFamilyProductionParityAcceptanceTests(TransactionTestCase):\n    def setUp(self) -> None:',
          )
          path.write_text(text)
          PY
          uv run ruff format backend/api/tests/test_cross_family_production_parity.py
          uv run ruff check backend/api/tests/test_cross_family_production_parity.py
          uv run mypy backend/api/tests/test_cross_family_production_parity.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/api/tests/test_cross_family_production_parity.py
          git commit -m "Use transaction-safe cross-family API harness"
          git push origin HEAD:feat/53-cross-family-production-parity
