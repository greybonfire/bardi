name: Format issue 52

on:
  push:
    branches:
      - feat/52-import-temporary-family-exemption

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/52-import-temporary-family-exemption
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked --extra dev
      - name: Normalize new Python files
        run: |
          uv run ruff check --fix --unsafe-fixes \
            backend/knowledge/importers/temporary_family_exemption.py \
            backend/knowledge/management/commands/import_temporary_family_exemption.py \
            backend/knowledge/tests/test_temporary_family_exemption_import.py
          uv run ruff format \
            backend/knowledge/importers/temporary_family_exemption.py \
            backend/knowledge/management/commands/import_temporary_family_exemption.py \
            backend/knowledge/tests/test_temporary_family_exemption_import.py
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/knowledge/importers/temporary_family_exemption.py \
            backend/knowledge/management/commands/import_temporary_family_exemption.py \
            backend/knowledge/tests/test_temporary_family_exemption_import.py
          git diff --cached --quiet && exit 0
          git commit -m "Format temporary family exemption import"
          git push origin HEAD:feat/52-import-temporary-family-exemption
