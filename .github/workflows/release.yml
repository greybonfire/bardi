name: Release prototype

on:
  push:
    tags:
      - "prototype-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish prototype release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile prototype
        run: python -m compileall -q prototype

      - name: Run prototype unit tests
        run: python -m unittest discover -s prototype/tests -v

      - name: Package immutable prototype snapshot
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="bardi-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$archive" README.md CONTEXT.md docs prototype
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
