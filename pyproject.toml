[project]
name = "bardi"
version = "0.1.0"
description = "Bardi production backend for sourced Egyptian administrative guidance"
requires-python = ">=3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1",
    "mypy>=2.3,<2.4",
    "django-stubs[compatible-mypy]>=6.1,<6.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["backend/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/knowledge/evidence_workflow.py" = ["E501"]
"backend/knowledge/migrations/0011_evidence_discrepancy_workflow.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
mypy_path = "backend"
files = ["backend"]
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_unreachable = true
warn_return_any = true
exclude = ["backend/.*/migrations/.*\\.py$"]

[tool.django-stubs]
django_settings_module = "bardi.settings.development"
